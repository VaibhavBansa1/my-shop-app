name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create roles and test database
        run: psql -h localhost -U postgres -v owner_pw="'shop_owner_dev'" -v app_pw="'shop_app_dev'" -v db=shop_test -f db/roles.sql
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          DATABASE_URL: postgres://shop_app:shop_app_dev@localhost:5432/shop_test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx expo-doctor
      - name: Bundle Android JavaScript (catches import/syntax errors)
        run: npx expo export --platform android --output-dir /tmp/mobile-dist
