# DO NOT commit real values. Create the secret with kubectl (see README.md) or a secret manager
# (External Secrets, Sealed Secrets, cloud KMS). Not included in kustomization.yaml on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: myshop-secrets
  namespace: myshop
type: Opaque
stringData:
  DATABASE_URL: postgres://shop_app:CHANGE_ME@your-postgres:5432/shop?sslmode=require
  DATABASE_OWNER_URL: postgres://shop_owner:CHANGE_ME@your-postgres:5432/shop?sslmode=require
  REDIS_URL: rediss://default:CHANGE_ME@your-redis:6379/0
  DATA_ENCRYPTION_KEY: CHANGE_ME_32_BYTES_BASE64
  METRICS_TOKEN: CHANGE_ME_LONG_RANDOM
  EMAIL_FROM: My Shop <no-reply@shop.example.in>
  EMAIL_PROVIDER: smtp
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_USER: CHANGE_ME
  SMTP_PASS: CHANGE_ME
  # Images (S3 / Cloudflare R2 / MinIO)
  S3_BUCKET: myshop-images
  S3_ENDPOINT: https://<account>.r2.cloudflarestorage.com
  S3_ACCESS_KEY_ID: CHANGE_ME
  S3_SECRET_ACCESS_KEY: CHANGE_ME
  IMAGE_URL_SECRET: CHANGE_ME_LONG_RANDOM
  # Kafka (optional)
  # KAFKA_BROKERS: broker-1:9092,broker-2:9092
  # KAFKA_SSL: "1"
  # KAFKA_SASL_MECHANISM: scram-sha-512
  # KAFKA_USERNAME: CHANGE_ME
  # KAFKA_PASSWORD: CHANGE_ME
