apiVersion: apps/v1
kind: Deployment
metadata:
  name: myshop-web
  labels: { app: myshop, component: web }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: myshop, component: web }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: myshop, component: web }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/metrics
        prometheus.io/port: "3000"
    spec:
      serviceAccountName: myshop
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: myshop, component: web } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: myshop
          command: ["node", "server.js"]
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: myshop-config }
            - secretRef: { name: myshop-secrets }
          env:
            # The web pods never need the migration (owner) credentials.
            - { name: DATABASE_OWNER_URL, value: "" }
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 30
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }   # OCR needs headroom; no CPU limit (avoid throttling)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        - { name: next-cache, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: myshop-web
  labels: { app: myshop, component: web }
spec:
  selector: { app: myshop, component: web }
  ports: [{ name: http, port: 80, targetPort: http }]
