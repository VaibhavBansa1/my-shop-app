# Web pods accept traffic only from the ingress controller and Prometheus; workers accept only metrics scrapes.
# Egress is open for Postgres/Redis/SMTP/AI providers (tighten to your CIDRs if you can).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myshop-web-ingress
spec:
  podSelector: { matchLabels: { app: myshop, component: web } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myshop-worker-ingress
spec:
  podSelector: { matchLabels: { app: myshop, component: worker } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 9091 }]
