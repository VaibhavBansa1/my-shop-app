# Run migrations before each rollout (CI: kubectl delete job myshop-migrate --ignore-not-found; kubectl apply -k …;
# kubectl wait --for=condition=complete job/myshop-migrate). Uses DATABASE_OWNER_URL; the app pods do not.
apiVersion: batch/v1
kind: Job
metadata:
  name: myshop-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: myshop
      restartPolicy: Never
      securityContext: &podsec
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: myshop
          command: ["node", "scripts/migrate.mjs"]
          envFrom:
            - configMapRef: { name: myshop-config }
          env:
            - name: DATABASE_OWNER_URL
              valueFrom: { secretKeyRef: { name: myshop-secrets, key: DATABASE_OWNER_URL } }
          securityContext: &csec
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
