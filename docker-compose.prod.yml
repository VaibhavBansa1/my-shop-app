# Full production-like stack on one machine:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Services: postgres, redis, migrate (runs once), web (2 replicas), worker. Put a TLS reverse proxy
# (Caddy/Nginx/Traefik or a cloud load balancer) in front of port 3000.
x-app: &app
  build: .
  image: myshop:latest
  restart: unless-stopped
  env_file: .env.production
  environment:
    DATABASE_URL: postgres://shop_app:${APP_DB_PASSWORD}@db:5432/shop
    DATABASE_OWNER_URL: postgres://shop_owner:${OWNER_DB_PASSWORD}@db:5432/shop
    REDIS_URL: redis://redis:6379/0
    EMAIL_VIA_QUEUE: "1"
    TRUST_PROXY: "1"
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  read_only: true
  tmpfs: [/tmp]
  volumes:
    - uploads:/app/data/uploads   # item photos and logos (or use STORAGE_DRIVER=s3)
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
  migrate:
    <<: *app
    restart: "no"
    command: ["node", "scripts/migrate.mjs"]
  web:
    <<: *app
    command: ["node", "server.js"]
    ports: ["3000:3000"]
    deploy: { replicas: 1 }
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    <<: *app
    command: ["node", "scripts/worker.mjs"]
    # EVENTS_ENABLED=1 and KAFKA_BROKERS=kafka:9092 in .env.production to publish business events
    depends_on:
      migrate: { condition: service_completed_successfully }
  # Optional event stream: docker compose --profile kafka … (set EVENTS_ENABLED=1, KAFKA_BROKERS=kafka:9092)
  kafka:
    image: apache/kafka:3.9.0
    profiles: [kafka]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: [kafkadata:/var/lib/kafka/data]
volumes:
  pgdata:
  redisdata:
  uploads:
  kafkadata:
